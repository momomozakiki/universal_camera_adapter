name: universal_camera_adapter
description: >-
  A modular, pluggable camera abstraction for Flutter. Unifies local device
  cameras (Android, Windows webcams) and external network/IP cameras (ONVIF/RTSP)
  behind a single, testable CameraAdapter interface.
version: 1.0.0
repository: https://github.com/momomozakiki/universal_camera_adapter
issue_tracker: https://github.com/momomozakiki/universal_camera_adapter/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Local device cameras (Android + Windows). The federated `camera` plugin
  # endorses its platform implementations (camera_android, camera_windows)
  # transitively — no need to list them explicitly for pub resolution.
  camera: ^0.12.0

  # --- ONVIF / IP-camera backend dependencies (added in v1.1) ---
  # WS-UsernameToken/HTTP Digest auth landed (2026-07-22): http + xml + crypto
  # are now real deps. media_kit is still deliberately deferred until the
  # media-service/RTSP-preview step lands, so consumers of the local-camera
  # path don't drag in a native RTSP stack before it's needed.
  http: ^1.6.0 # ONVIF SOAP requests
  xml: ^7.0.0 # ONVIF SOAP/XML parsing
  crypto: ^3.0.0 # WS-UsernameToken PasswordDigest (SHA1) + HTTP Digest (MD5)
  # media_kit: ^1.2.0       # RTSP preview (native) — deferred to media-service step
  # media_kit_video: ^2.0.0 # RTSP video widget — deferred to media-service step

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
