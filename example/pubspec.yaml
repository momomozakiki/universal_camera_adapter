name: universal_camera_adapter_example
description: Minimal example app demonstrating universal_camera_adapter.
publish_to: none
# Versions the example APK independently of the root package (drives dist/ artifact
# names via scripts/build-apk.ps1). Bump on every distributable build — see
# .claude/skills/release-packaging/SKILL.md.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  universal_camera_adapter:
    path: ../
  # Cross-platform (Android + Windows) barcode/QR reader used by the scanner
  # tabs to decode a JPEG from CameraAdapter.captureFrame(). `image` decodes +
  # downsamples the JPEG; flutter_zxing (zxing-cpp) decodes QR and 1D formats.
  # See example/lib/scanning/.
  image: ^4.3.0
  flutter_zxing: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
