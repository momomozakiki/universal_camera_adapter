name: universal_camera_adapter_example
description: Minimal example app demonstrating universal_camera_adapter.
publish_to: none
# Versions the example APK independently of the root package (drives dist/ artifact
# names via scripts/build-apk.ps1). Bump on every distributable build — see
# .claude/skills/release-packaging/SKILL.md.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  universal_camera_adapter:
    path: ../
  # Cross-platform (Android + Windows) barcode/QR reader used by the scanner
  # tabs to decode a JPEG from CameraAdapter.captureFrame(). `image` decodes +
  # downsamples the JPEG; flutter_zxing (zxing-cpp) decodes QR and 1D formats.
  # See example/lib/scanning/.
  image: ^4.3.0
  flutter_zxing: ^2.2.0
  # Native EZVIZ player widget (wraps EZVIZ's own Android/iOS SDKs), used only
  # by the EZVIZ bridge test tab (example/lib/tabs/ezviz_tab.dart) to play a
  # camera's live stream directly from its serial + the account's Open
  # Platform accessToken (from scripts/ezviz_bridge.py) - no HLS/RTMP/ezopen
  # URL handling needed on the Dart side at all. Android/iOS only (no Windows
  # implementation exists), which matches this project's existing Windows
  # toolchain constraint (see webview_flutter_windows's C++23 requirement,
  # ruled out for the same reason).
  ezviz_flutter: ^1.2.7
  http: ^1.2.0
  # Persists the EZVIZ tab's bridge host and verification code fields across
  # app restarts (example/lib/tabs/ezviz_tab.dart) - a testing convenience
  # only, not device credentials, so plain local storage is fine.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
