name: universal_camera_adapter_example
description: Minimal example app demonstrating universal_camera_adapter.
publish_to: none
# Versions the example APK independently of the root package (drives dist/ artifact
# names via scripts/build-apk.ps1). Bump on every distributable build — see
# .claude/skills/release-packaging/SKILL.md.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  universal_camera_adapter:
    path: ../
  # Non-endorsed Windows implementation of the `camera` plugin. Native plugin
  # registration is driven by the *app's* dependency graph, so it must be a
  # direct dep here too for generated_plugin_registrant.cc to bind the webcam
  # on Windows.
  camera_windows: ^0.2.6
  # Direct dep needed only for MediaKit.ensureInitialized() at app startup
  # (main.dart) — required once before any media_kit API use, per its setup
  # docs. universal_camera_adapter already depends on it transitively for
  # ONVIF's RtspPreview (lib/src/onvif/rtsp_preview.dart); Dart requires a
  # direct dependency to import it directly here.
  media_kit: ^1.2.0
  # Cross-platform (Android + Windows) barcode/QR reader used by the scanner
  # tabs to decode a JPEG from CameraAdapter.captureFrame(). `image` decodes +
  # downsamples the JPEG; flutter_zxing (zxing-cpp) decodes QR and 1D formats.
  # See example/lib/scanning/.
  image: ^4.3.0
  flutter_zxing: ^2.2.0
  # Native EZVIZ player + per-user login (wraps EZVIZ's own Android/iOS SDKs),
  # used by EzvizCameraAdapter (example/lib/ezviz/ezviz_camera_adapter.dart)
  # and its setup wizard (example/lib/ezviz/ezviz_setup_wizard.dart). Each
  # user signs in via EzvizAuthManager.openLoginPage (EZVIZ's own hosted login
  # page - this app never sees a password); the native SDK caches the
  # resulting access token itself, so no token/credential storage of our own
  # is needed. Android/iOS only (no Windows implementation exists), which
  # matches this project's existing Windows toolchain constraint (see
  # webview_flutter_windows's C++23 requirement, ruled out for the same
  # reason in an earlier iteration of this tab).
  #
  # Vendored (not pulled from pub.dev) because pub.dev 1.2.7 crashes the whole
  # app in EzvizManager.kt's getDeviceList: it tries to send a raw
  # EZConstants.EZVideoLevel enum (e.g. "VIDEO_LEVEL_4K") through Flutter's
  # StandardMessageCodec, which only supports primitives and throws
  # IllegalArgumentException - confirmed via adb logcat against this repo's
  # own EZVIZ CS-H6c. Patched to send camera.videoLevel.ordinal instead. See
  # third_party/ezviz_flutter/android/.../EzvizManager.kt.
  ezviz_flutter:
    path: third_party/ezviz_flutter
  # Persists the EZVIZ setup wizard's verification-code field across app
  # restarts (example/lib/ezviz/ezviz_setup_wizard.dart) - a testing
  # convenience only, not a credential (the SDK's own native cache handles
  # the actual access token).
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
